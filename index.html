<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SixFinger AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23CC785C'/%3E%3Ctext x='16' y='21' font-family='Arial' font-size='13' font-weight='700' fill='white' text-anchor='middle'%3ESF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-100:#0C0C0E; --bg-200:#131316; --bg-300:#1A1A1F; --bg-400:#212128;
  --border:rgba(255,255,255,.08); --border-hover:rgba(255,255,255,.14);
  --accent:#CC785C; --accent-2:#B5674D;
  --text-000:#FFFFFF; --text-100:#EDEDEE; --text-200:#B4B4BB; --text-300:#7A7A82; --text-400:#4A4A52;
  --user-bg:#1E1E25; --code-bg:#0E0E12;
  --sidebar-w:264px;
}
html,body{height:100%;height:100dvh;font-family:'Inter',system-ui,sans-serif;background:var(--bg-100);color:var(--text-100);overflow:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg-400);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:#323240}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}

#app{display:flex;height:100dvh;overflow:hidden;position:relative}

#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;backdrop-filter:blur(2px)}
#overlay.active{display:block}

/* ── SIDEBAR ── */
#sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--bg-200);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:transform .18s ease,width .18s ease,min-width .18s ease;z-index:160;flex-shrink:0}
@media(max-width:768px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0);box-shadow:8px 0 32px rgba(0,0,0,.6)}
}
.sb-top{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 10px;gap:8px}
.sb-logo{display:flex;align-items:center;gap:9px;padding:4px;border-radius:8px;transition:opacity .15s}
.sb-logo:hover{opacity:.85}
.sb-mark{width:26px;height:26px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0}
.sb-name{font-size:14.5px;font-weight:650;letter-spacing:-.2px;color:var(--text-000)}
.icon-btn{width:30px;height:30px;background:transparent;border:none;border-radius:7px;color:var(--text-300);display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;flex-shrink:0}
.icon-btn:hover{background:var(--bg-300);color:var(--text-100)}
.icon-btn svg{width:16px;height:16px}

.new-chat-btn{margin:2px 12px 14px;padding:9px 14px;background:var(--bg-300);border:1px solid var(--border);border-radius:10px;color:var(--text-100);font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:9px;transition:background .15s,border-color .15s}
.new-chat-btn:hover{background:var(--bg-400);border-color:var(--border-hover)}
.new-chat-btn svg{width:15px;height:15px;flex-shrink:0}

.sb-label{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--text-400);padding:4px 22px 6px}

.chat-list{flex:1;overflow-y:auto;padding:0 10px;display:flex;flex-direction:column;gap:2px}
.chat-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font-size:13.5px;color:var(--text-200);transition:background .15s,color .15s;position:relative}
.chat-item:hover{background:var(--bg-300);color:var(--text-100)}
.chat-item.active{background:var(--bg-400);color:var(--text-100)}
.chat-item-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item-del{width:20px;height:20px;background:transparent;border:none;border-radius:5px;color:var(--text-400);display:none;align-items:center;justify-content:center;flex-shrink:0;font-size:0;transition:background .15s,color .15s}
.chat-item:hover .chat-item-del{display:flex}
.chat-item-del:hover{background:rgba(239,68,68,.15);color:#ef4444}
.chat-list-empty{padding:10px 12px;font-size:12.5px;color:var(--text-400);font-style:italic}

.sb-footer{border-top:1px solid var(--border);padding:10px}
.user-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px}
.user-avatar{width:28px;height:28px;background:linear-gradient(135deg,var(--accent),#e0895a);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.user-name{font-size:13px;font-weight:500;color:var(--text-100)}
.user-sub{font-size:11px;color:var(--text-300)}

/* ── MAIN ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg-100)}

#header{height:54px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--border);flex-shrink:0}
#mobile-toggle{display:none}
@media(max-width:768px){#mobile-toggle{display:flex}}

.model-pill{display:flex;align-items:center;gap:6px;padding:6px 11px;background:var(--bg-300);border:1px solid var(--border);border-radius:9px;transition:background .15s,border-color .15s;position:relative}
.model-pill:hover{background:var(--bg-400);border-color:var(--border-hover)}
.model-pill svg{width:13px;height:13px;color:var(--text-300);flex-shrink:0}
#model-select{background:transparent;border:none;outline:none;color:var(--text-100);font-size:13.5px;font-weight:500;font-family:inherit;cursor:pointer;max-width:220px;appearance:none;padding-right:4px}
#model-select option{background:var(--bg-300);color:var(--text-100)}

#header-spacer{flex:1}

/* ── MESSAGES ── */
#scroll-area{flex:1;overflow-y:auto;scroll-behavior:smooth}
#messages-inner{max-width:740px;margin:0 auto;padding:24px 20px 16px;display:flex;flex-direction:column;gap:2px}

#welcome{display:flex;flex-direction:column;align-items:center;text-align:center;padding:56px 20px 32px;gap:14px}
.welcome-mark{width:54px;height:54px;background:var(--accent);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;box-shadow:0 0 48px rgba(204,120,92,.25);margin-bottom:4px}
.welcome-h{font-size:27px;font-weight:650;letter-spacing:-.4px;color:var(--text-000)}
.welcome-p{font-size:14px;color:var(--text-300);line-height:1.6;max-width:380px}

.starters{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px;width:100%;max-width:520px}
@media(max-width:480px){.starters{grid-template-columns:1fr}}
.starter{background:var(--bg-200);border:1px solid var(--border);border-radius:11px;padding:13px 15px;font-size:13px;color:var(--text-200);text-align:left;line-height:1.5;transition:background .15s,border-color .15s,color .15s}
.starter:hover{background:var(--bg-300);border-color:var(--border-hover);color:var(--text-100)}

.msg{display:flex;flex-direction:column}
.msg.user{align-items:flex-end;margin-top:10px}
.msg.assistant{align-items:flex-start;margin-top:4px}
.msg-bubble{max-width:85%;padding:11px 16px;border-radius:16px;font-size:14.5px;line-height:1.7;word-break:break-word}
.msg.user .msg-bubble{background:var(--user-bg);border:1px solid var(--border);border-radius:16px 16px 4px 16px;color:var(--text-100)}
.msg.assistant .msg-bubble{background:transparent;border:none;padding:6px 4px;color:var(--text-100);max-width:100%}
.msg-bubble strong{color:var(--text-000);font-weight:650}
.msg-bubble em{color:var(--text-200)}
.msg-bubble a{color:var(--accent);text-decoration:underline;text-decoration-color:rgba(204,120,92,.4)}
.msg-bubble code{font-family:'JetBrains Mono',monospace;font-size:12.5px;background:var(--code-bg);border:1px solid var(--border);padding:1px 6px;border-radius:5px;color:#d599d6}
.msg-bubble pre{background:var(--code-bg);border:1px solid var(--border);border-radius:11px;padding:14px 16px;overflow-x:auto;margin:10px 0}
.msg-bubble pre code{background:transparent;border:none;padding:0;font-size:12.5px;color:#b8bfc9;line-height:1.55}
.msg-bubble ul,.msg-bubble ol{padding-left:1.4em;margin:6px 0}
.msg-bubble li{margin:3px 0}
.msg-bubble h1,.msg-bubble h2,.msg-bubble h3{color:var(--text-000);font-weight:650;margin:12px 0 5px;letter-spacing:-.2px}
.msg-bubble h1{font-size:19px}.msg-bubble h2{font-size:17px}.msg-bubble h3{font-size:15px}
.msg-bubble p{margin:4px 0}
.msg-bubble blockquote{border-left:3px solid var(--accent);padding-left:12px;color:var(--text-200);margin:8px 0}
.msg-bubble hr{border:none;border-top:1px solid var(--border);margin:10px 0}

.cursor{display:inline-block;width:2px;height:1.05em;background:var(--accent);margin-left:1px;vertical-align:text-bottom;border-radius:1px;animation:blink 1s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

.typing{display:inline-flex;gap:4px;align-items:center;padding:8px 4px}
.typing span{width:5px;height:5px;background:var(--text-300);border-radius:50%;animation:dots 1.3s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes dots{0%,80%,100%{transform:scale(.6);opacity:.3}40%{transform:scale(1);opacity:1}}

/* ── COMPOSER ── */
#input-area{padding:10px 20px 18px;flex-shrink:0}
.input-wrap{max-width:740px;margin:0 auto;background:var(--bg-200);border:1px solid var(--border);border-radius:16px;transition:border-color .2s,box-shadow .2s;overflow:hidden}
.input-wrap:focus-within{border-color:rgba(204,120,92,.4);box-shadow:0 0 0 3px rgba(204,120,92,.08)}
.input-row{display:flex;align-items:flex-end;gap:8px;padding:11px 12px}
#user-input{flex:1;background:transparent;border:none;outline:none;color:var(--text-100);font-size:14.5px;font-family:inherit;resize:none;max-height:200px;min-height:24px;line-height:1.6;padding:2px 0}
#user-input::placeholder{color:var(--text-400)}
.send-btn{width:33px;height:33px;background:var(--accent);border:none;border-radius:9px;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,transform .1s,opacity .15s}
.send-btn:hover:not(:disabled){background:var(--accent-2)}
.send-btn:active:not(:disabled){transform:scale(.93)}
.send-btn:disabled{opacity:.35;cursor:not-allowed}
.send-btn svg{width:15px;height:15px}
.stop-btn{width:33px;height:33px;background:var(--bg-400);border:1px solid var(--border);border-radius:9px;color:var(--text-200);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,border-color .15s,color .15s}
.stop-btn:hover{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.35);color:#ef4444}
.stop-btn svg{width:13px;height:13px}
.input-hint{text-align:center;font-size:11.5px;color:var(--text-400);padding:7px 0 0}

/* ── TOAST ── */
#toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--bg-400);border:1px solid var(--border);border-radius:10px;padding:10px 18px;font-size:13px;color:var(--text-100);opacity:0;pointer-events:none;z-index:999;max-width:min(90vw,420px);text-align:center;transition:opacity .25s,transform .25s;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <div id="overlay" onclick="closeSidebar()"></div>

  <aside id="sidebar">
    <div class="sb-top">
      <a href="#" class="sb-logo" onclick="newChat();return false;">
        <div class="sb-mark">SF</div>
        <span class="sb-name">SixFinger AI</span>
      </a>
      <button class="icon-btn" onclick="toggleSidebar()" title="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2.5"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
      </button>
    </div>

    <button class="new-chat-btn" onclick="newChat()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New chat
    </button>

    <div class="sb-label">Recents</div>
    <div class="chat-list" id="chat-list">
      <div class="chat-list-empty">No chats yet</div>
    </div>

    <div class="sb-footer">
      <div class="user-row">
        <div class="user-avatar">M</div>
        <div>
          <div class="user-name">Marco</div>
          <div class="user-sub" id="status-sub">SixFinger AI</div>
        </div>
      </div>
    </div>
  </aside>

  <main id="main">
    <div id="header">
      <button class="icon-btn" id="mobile-toggle" onclick="toggleSidebar()" title="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="model-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
        <select id="model-select" onchange="onModelChange()"><option value="">Loading models…</option></select>
      </div>
      <div id="header-spacer"></div>
    </div>

    <div id="scroll-area">
      <div id="messages-inner">
        <div id="welcome">
          <div class="welcome-mark">SF</div>
          <div class="welcome-h" id="greeting">Good evening, Marco</div>
          <div class="welcome-p">Chat with any model from your SixFinger backend.</div>
          <div class="starters">
            <button class="starter" onclick="sendMessage(this.textContent)">Write a Python script to rename files in bulk by date</button>
            <button class="starter" onclick="sendMessage(this.textContent)">Explain how transformers work in ML</button>
            <button class="starter" onclick="sendMessage(this.textContent)">Debug this: my React component re-renders infinitely</button>
            <button class="starter" onclick="sendMessage(this.textContent)">Write a bash script to back up a folder</button>
          </div>
        </div>
      </div>
    </div>

    <div id="input-area">
      <div class="input-wrap">
        <div class="input-row">
          <textarea id="user-input" placeholder="Message SixFinger AI…" rows="1" oninput="onInput(this)" onkeydown="onKey(event)"></textarea>
          <button class="stop-btn" id="stop-btn" onclick="stopGen()" style="display:none" title="Stop">
            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
          <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled title="Send (Enter)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
      <div class="input-hint">AI can make mistakes — double-check important info.</div>
    </div>
  </main>
</div>

<div id="toast"></div>

<script>
// ── STATE ──────────────────────────────────────────────────────────────────
let convos   = JSON.parse(localStorage.getItem('sfai:convos') || '[]');
let curId    = null;
let busy     = false;
let abortCtl = null;
let models   = [];
let curModel = localStorage.getItem('sfai:model') || '';

// ── BOOT ───────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  setGreeting();
  renderChatList();
  fetchModels();
  window.addEventListener('resize', () => { if (window.innerWidth >= 769) closeSidebar(); });
});

function setGreeting() {
  const h = new Date().getHours();
  const t = h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening';
  document.getElementById('greeting').textContent = `Good ${t}, Marco`;
}

// ── SIDEBAR ────────────────────────────────────────────────────────────────
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('overlay');
  if (window.innerWidth >= 769) {
    const collapsed = sb.style.width === '0px';
    sb.style.width = collapsed ? '' : '0px';
    sb.style.minWidth = collapsed ? '' : '0px';
    sb.style.borderColor = collapsed ? '' : 'transparent';
  } else {
    const open = sb.classList.toggle('open');
    ov.classList.toggle('active', open);
  }
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('active');
}

// ── MODELS ─────────────────────────────────────────────────────────────────
async function fetchModels() {
  const sel = document.getElementById('model-select');
  try {
    const res = await fetch('/api/models');
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    const list = data.data || data.models || (Array.isArray(data) ? data : []);
    models = list.map(m => typeof m === 'string' ? m : (m.id || m.name || '')).filter(Boolean);

    if (!models.length) throw new Error('empty');

    if (!curModel || !models.includes(curModel)) curModel = models[0];
    sel.innerHTML = models.map(m => `<option value="${esc(m)}"${m===curModel?' selected':''}>${esc(m)}</option>`).join('');
    localStorage.setItem('sfai:model', curModel);
  } catch (e) {
    sel.innerHTML = '<option value="">No models found</option>';
    showToast('Could not load models — check the backend / API key');
    console.warn('[models]', e);
  }
}
function onModelChange() {
  curModel = document.getElementById('model-select').value;
  localStorage.setItem('sfai:model', curModel);
}

// ── CONVERSATIONS ──────────────────────────────────────────────────────────
function saveConvos() {
  localStorage.setItem('sfai:convos', JSON.stringify(convos));
  renderChatList();
}

function newChat() {
  curId = uid();
  convos.unshift({ id: curId, title: 'New chat', messages: [] });
  saveConvos();
  clearMessagesUI();
  document.getElementById('welcome').style.display = '';
  if (window.innerWidth < 769) closeSidebar();
}

function loadConvo(id) {
  curId = id;
  const c = convos.find(x => x.id === id);
  if (!c) return;
  clearMessagesUI();
  document.getElementById('welcome').style.display = 'none';
  const container = document.getElementById('messages-inner');
  c.messages.forEach(m => container.appendChild(makeMsgEl(m.role, m.content)));
  scrollBottom(true);
  renderChatList();
  if (window.innerWidth < 769) closeSidebar();
}

function deleteConvo(id, e) {
  e.stopPropagation();
  convos = convos.filter(c => c.id !== id);
  if (curId === id) { curId = null; clearMessagesUI(); document.getElementById('welcome').style.display = ''; }
  saveConvos();
}

function clearMessagesUI() {
  const container = document.getElementById('messages-inner');
  Array.from(container.children).forEach(el => { if (el.id !== 'welcome') el.remove(); });
}

function renderChatList() {
  const el = document.getElementById('chat-list');
  if (!convos.length) { el.innerHTML = '<div class="chat-list-empty">No chats yet</div>'; return; }
  el.innerHTML = convos.map(c => `
    <div class="chat-item${c.id===curId?' active':''}" onclick="loadConvo('${c.id}')">
      <span class="chat-item-title">${esc(c.title)}</span>
      <button class="chat-item-del" onclick="deleteConvo('${c.id}',event)" title="Delete">✕</button>
    </div>`).join('');
}

// ── RENDERING ──────────────────────────────────────────────────────────────
function makeMsgEl(role, content) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = renderMd(content);
  wrap.appendChild(bubble);
  return wrap;
}

function renderMd(raw) {
  if (!raw) return '';
  let t = raw
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/```(\w*)\n?([\s\S]*?)```/g, (_,l,code) => `<pre><code>${code.trim()}</code></pre>`)
    .replace(/`([^`\n]+)`/g,'<code>$1</code>')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/^---+$/gm,'<hr>')
    .replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/__(.+?)__/g,'<strong>$1</strong>')
    .replace(/(?<!\w)_(.+?)_(?!\w)/g,'<em>$1</em>')
    .replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>')
    .replace(/^[\*\-] (.+)$/gm,'<li>$1</li>')
    .replace(/^\d+\. (.+)$/gm,'<li>$1</li>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\n/g,'<br>');
  t = t.replace(/(<li>.*?<\/li>(\s*<br>)*)+/g, m => `<ul>${m.replace(/<br>/g,'')}</ul>`);
  return t;
}

function scrollBottom(instant) {
  const el = document.getElementById('scroll-area');
  if (instant) el.scrollTop = el.scrollHeight;
  else requestAnimationFrame(() => el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' }));
}

// ── SEND / STREAM ──────────────────────────────────────────────────────────
async function sendMessage(presetText) {
  const inp = document.getElementById('user-input');
  const text = (typeof presetText === 'string' ? presetText : inp.value).trim();
  if (!text || busy) return;

  if (!curId) {
    curId = uid();
    convos.unshift({ id: curId, title: text.slice(0,48), messages: [] });
  }
  const convo = convos.find(c => c.id === curId);
  if (convo.title === 'New chat') convo.title = text.slice(0,48);

  convo.messages.push({ role: 'user', content: text });
  saveConvos();

  document.getElementById('welcome').style.display = 'none';
  inp.value = '';
  onInput(inp);

  const container = document.getElementById('messages-inner');
  container.appendChild(makeMsgEl('user', text));

  const asstWrap = document.createElement('div');
  asstWrap.className = 'msg assistant';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  asstWrap.appendChild(bubble);
  container.appendChild(asstWrap);
  scrollBottom();

  setBusy(true);
  abortCtl = new AbortController();

  // IMPORTANT: send the FULL history including the message just added above
  const payloadMessages = convo.messages.map(m => ({ role: m.role, content: m.content }));
  let assistantText = '';
  let started = false;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: curModel, messages: payloadMessages, stream: true, max_tokens: 4096 }),
      signal: abortCtl.signal,
    });

    if (!res.ok) {
      const errText = await res.text();
      throw new Error(`${res.status}: ${errText.slice(0,300)}`);
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop() || '';
      for (const line of lines) {
        const t = line.trim();
        if (!t.startsWith('data:')) continue;
        const d = t.slice(5).trim();
        if (d === '[DONE]') continue;
        try {
          const chunk = JSON.parse(d);
          const delta = chunk.choices?.[0]?.delta?.content || '';
          if (delta) {
            if (!started) { bubble.innerHTML = ''; started = true; }
            assistantText += delta;
            bubble.innerHTML = renderMd(assistantText) + '<span class="cursor"></span>';
            scrollBottom();
          }
        } catch {}
      }
    }
  } catch (err) {
    if (err.name !== 'AbortError') {
      try {
        const res2 = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: curModel, messages: payloadMessages, stream: false, max_tokens: 4096 }),
        });
        const data = await res2.json();
        assistantText = data.choices?.[0]?.message?.content || '';
        if (!assistantText) throw new Error('Empty response');
      } catch (err2) {
        showToast(err.message || 'Something went wrong');
      }
    }
  } finally {
    if (assistantText) {
      bubble.innerHTML = renderMd(assistantText);
      convo.messages.push({ role: 'assistant', content: assistantText });
    } else {
      asstWrap.remove();
    }
    abortCtl = null;
    setBusy(false);
    saveConvos();
    scrollBottom();
  }
}

function stopGen() { if (abortCtl) abortCtl.abort(); }

function setBusy(v) {
  busy = v;
  document.getElementById('send-btn').style.display = v ? 'none' : 'flex';
  document.getElementById('stop-btn').style.display = v ? 'flex' : 'none';
  if (!v) document.getElementById('send-btn').disabled = !document.getElementById('user-input').value.trim();
}

// ── INPUT ──────────────────────────────────────────────────────────────────
function onInput(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 200) + 'px';
  document.getElementById('send-btn').disabled = !el.value.trim() || busy;
}
function onKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

// ── TOAST ──────────────────────────────────────────────────────────────────
let toastT;
function showToast(msg, dur = 3200) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), dur);
}

// ── UTILS ──────────────────────────────────────────────────────────────────
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
