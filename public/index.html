<script>
// ═══════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════
let convos   = JSON.parse(localStorage.getItem('sf:convos') || '[]');
let curId    = null;
let busy     = false;
let abort    = null;
let models   = [];
let curModel = localStorage.getItem('sf:model') || '';
let sidebarVisible = true;

// ═══════════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  updateGreeting();
  renderChatList();
  fetchModels();
  setupInput();
  setupSidebar();
  setupModelDropdown();
});

// ═══════════════════════════════════════════════════════════════
//  GREETING
// ═══════════════════════════════════════════════════════════════
function updateGreeting() {
  const h = new Date().getHours();
  const t = h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening';
  const el = document.getElementById('greeting-text');
  if (el) el.textContent = `Good ${t}, Marco.`;
}

// ═══════════════════════════════════════════════════════════════
//  MODELS
// ═══════════════════════════════════════════════════════════════
async function fetchModels() {
  try {
    const r = await fetch('/api/models');
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    models = (data.data || data.models || (Array.isArray(data) ? data : [])).map(m =>
      typeof m === 'string' ? m : (m.id || m.name || '')
    ).filter(Boolean);

    if (!curModel && models.length) curModel = models[0];
    updateModelLabel();
    renderModelList();
  } catch (e) {
    document.getElementById('model-label').textContent = 'Error loading models';
    console.warn('[models]', e);
  }
}

function updateModelLabel() {
  const el = document.getElementById('model-label');
  if (!el || !curModel) return;
  // Format like Claude.ai: "modelname" with version highlighted
  el.textContent = curModel;
}

function renderModelList() {
  const list = document.getElementById('model-list');
  if (!list) return;
  list.innerHTML = models.map(m => `
    <button type="button" role="menuitem" onclick="selectModel('${esc(m)}')"
      class="cds-reset group/btn relative isolate inline-flex shrink-0 items-center justify-center gap-1.5 whitespace-nowrap select-none border-0 outline-none focus-visible:outline-hidden w-full h-8 px-3 text-sm text-left transition-colors hover:text-primary text-secondary"
      style="justify-content:flex-start;">
      <span aria-hidden="true" class="absolute -z-[1] rounded-[inherit] bg-transparent group-hover/btn:bg-fill-ghost-hover inset-0"></span>
      <span class="truncate">${esc(m)}</span>
      ${m === curModel ? '<svg class="ml-auto shrink-0" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
    </button>
  `).join('');
}

function selectModel(m) {
  curModel = m;
  localStorage.setItem('sf:model', m);
  updateModelLabel();
  renderModelList();
  closeDropdown();
}

// ═══════════════════════════════════════════════════════════════
//  SIDEBAR
// ═══════════════════════════════════════════════════════════════
function setupSidebar() {
  document.getElementById('sidebar-toggle').addEventListener('click', toggleSidebar);
  document.getElementById('header-sidebar-toggle').addEventListener('click', toggleSidebar);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDropdown(); });
}

function toggleSidebar() {
  sidebarVisible = !sidebarVisible;
  const wrapper  = document.getElementById('sidebar-wrapper');
  const sticky   = document.getElementById('sidebar-sticky');
  const sidebar  = document.getElementById('sidebar');
  const headerBtn = document.getElementById('header-sidebar-toggle');

  if (sidebarVisible) {
    wrapper.style.width  = '18rem';
    sticky.style.width   = '18rem';
    sidebar.style.width  = '18rem';
    sidebar.style.borderColor = '';
    sidebar.style.backgroundColor = '';
    headerBtn.style.display = 'none';
  } else {
    wrapper.style.width  = '0px';
    sticky.style.width   = '0px';
    sidebar.style.width  = '0px';
    sidebar.style.borderColor = 'transparent';
    sidebar.style.backgroundColor = 'transparent';
    headerBtn.style.display = 'flex';
  }
}

// ═══════════════════════════════════════════════════════════════
//  MODEL DROPDOWN
// ═══════════════════════════════════════════════════════════════
function setupModelDropdown() {
  document.getElementById('model-btn').addEventListener('click', e => {
    e.stopPropagation();
    const dd = document.getElementById('model-dropdown');
    dd.classList.toggle('hidden');
  });
  document.addEventListener('click', closeDropdown);
}

function closeDropdown() {
  document.getElementById('model-dropdown').classList.add('hidden');
}

// ═══════════════════════════════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════════════════════════════
function setupInput() {
  const inp = document.getElementById('static-composer-input');
  const sendBtn = document.getElementById('send-btn');
  const stopBtn = document.getElementById('stop-btn');

  inp.addEventListener('input', () => {
    const text = inp.innerText.trim();
    sendBtn.disabled = !text || busy;
    // Add/remove empty placeholder class
    if (text) {
      inp.querySelector('p')?.classList.remove('is-empty', 'is-editor-empty');
    } else {
      if (!inp.querySelector('p')) {
        inp.innerHTML = '<p data-placeholder="How can I help you today?" class="is-empty is-editor-empty"><br class="ProseMirror-trailingBreak"></p>';
      }
    }
  });

  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);
  stopBtn.addEventListener('click', () => { if (abort) { abort.abort(); } });
}

// ═══════════════════════════════════════════════════════════════
//  CONVERSATIONS
// ═══════════════════════════════════════════════════════════════
function curMessages() {
  return (convos.find(c => c.id === curId) || {}).messages || [];
}
function pushMessage(msg) {
  const c = convos.find(x => x.id === curId);
  if (c) { c.messages.push(msg); save(); }
}
function save() {
  localStorage.setItem('sf:convos', JSON.stringify(convos));
  renderChatList();
}

function newChat() {
  curId = uid();
  convos.unshift({ id: curId, title: 'New chat', messages: [], ts: Date.now() });
  save();
  const container = document.getElementById('messages-container');
  // Clear all messages except welcome
  Array.from(container.children).forEach(el => {
    if (el.id !== 'welcome') el.remove();
  });
  document.getElementById('welcome').style.display = '';
  renderChatList();
}

function loadConvo(id) {
  curId = id;
  const c = convos.find(x => x.id === id);
  if (!c) return;
  const container = document.getElementById('messages-container');
  Array.from(container.children).forEach(el => { if (el.id !== 'welcome') el.remove(); });
  document.getElementById('welcome').style.display = 'none';
  c.messages.forEach(m => container.appendChild(makeMsgEl(m.role, m.content)));
  scrollBottom(true);
  renderChatList();
}

function deleteConvo(id, e) {
  e.stopPropagation();
  convos = convos.filter(c => c.id !== id);
  if (curId === id) { curId = null; newChat(); }
  save();
}

function renderChatList() {
  const el = document.getElementById('chat-list');
  if (!convos.length) { el.innerHTML = ''; return; }
  el.innerHTML = convos.map(c => `
    <div class="relative group">
      <a href="/" onclick="loadConvo('${c.id}');return false;"
         class="inline-flex items-center justify-center relative isolate shrink-0 can-focus select-none border-transparent transition font-base duration-300 h-8 rounded-md px-3 min-w-[4rem] whitespace-nowrap !text-xs w-full !min-w-0 group py-1.5 !rounded-[9px] px-4 !transition-none !-outline-offset-2 overflow-hidden ${c.id===curId?'bg-fill-ghost-active':''} _fill_19tw7_9 _ghost_19tw7_96"
         aria-label="${esc(c.title)}">
        <div class="-translate-x-2 w-full flex flex-row items-center justify-start gap-3">
          <span class="truncate text-sm whitespace-nowrap flex-1 text-left sf-nav-item-text">${esc(c.title)}</span>
        </div>
      </a>
      <button onclick="deleteConvo('${c.id}',event)"
        class="absolute right-2 top-1 opacity-0 group-hover:opacity-100 cds-reset inline-flex items-center justify-center w-5 h-5 rounded text-muted hover:text-primary transition-opacity"
        title="Delete">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  `).join('');
}

// ═══════════════════════════════════════════════════════════════
//  SEND / STREAM
// ═══════════════════════════════════════════════════════════════
async function sendMessage() {
  const inp = document.getElementById('static-composer-input');
  const text = inp.innerText.trim();
  if (!text || busy) return;

  // Ensure convo exists
  if (!curId) {
    curId = uid();
    convos.unshift({ id: curId, title: text.slice(0,45), messages: [], ts: Date.now() });
  } else {
    const c = convos.find(x => x.id === curId);
    if (c && c.title === 'New chat') c.title = text.slice(0,45);
  }

  // Hide welcome, clear input
  document.getElementById('welcome').style.display = 'none';
  inp.innerHTML = '<p data-placeholder="How can I help you today?" class="is-empty is-editor-empty"><br class="ProseMirror-trailingBreak"></p>';
  document.getElementById('send-btn').disabled = true;

  // User message
  const userMsg = { role: 'user', content: text };
  pushMessage(userMsg);
  const container = document.getElementById('messages-container');
  container.appendChild(makeMsgEl('user', text));
  scrollBottom();

  // Typing indicator
  const asstEl = makeTypingEl();
  container.appendChild(asstEl);
  scrollBottom();

  setBusy(true);
  const messages = curMessages();
  let fullText = '';
  abort = new AbortController();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: curModel,
        messages: messages.slice(0,-1).map(m => ({ role: m.role, content: m.content })), // excludes the assistant placeholder we haven't pushed yet
        max_tokens: 4096,
      }),
      signal: abort.signal,
    });

    if (!res.ok) {
      const errText = await res.text();
      throw new Error(`${res.status}: ${errText.slice(0,200)}`);
    }

    const reader  = res.body.getReader();
    const dec     = new TextDecoder();
    let buf = '';
    let started = false;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop() || '';
      for (const line of lines) {
        const t = line.trim();
        if (!t.startsWith('data:')) continue;
        const d = t.slice(5).trim();
        if (d === '[DONE]') continue;
        try {
          const chunk = JSON.parse(d);
          const delta = chunk.choices?.[0]?.delta?.content || '';
          if (delta) {
            if (!started) {
              // Replace typing indicator with real content
              asstEl.innerHTML = buildAsstBubble('');
              started = true;
            }
            fullText += delta;
            const bubble = asstEl.querySelector('.sf-asst-content');
            if (bubble) {
              bubble.innerHTML = renderMd(fullText);
              bubble.classList.add('sf-msg-stream');
            }
            scrollBottom();
          }
        } catch {}
      }
    }
  } catch (err) {
    if (err.name !== 'AbortError') {
      fullText = fullText || `⚠️ Error: ${err.message}`;
    }
  } finally {
    // Finalize assistant message
    if (fullText) {
      asstEl.innerHTML = buildAsstBubble(fullText);
      const bubble = asstEl.querySelector('.sf-asst-content');
      if (bubble) bubble.classList.remove('sf-msg-stream');
      pushMessage({ role: 'assistant', content: fullText });
    } else if (!fullText && abort?.signal?.aborted) {
      asstEl.innerHTML = buildAsstBubble('*Generation stopped.*');
      pushMessage({ role: 'assistant', content: '(stopped)' });
    } else {
      asstEl.remove();
    }
    abort = null;
    setBusy(false);
    save();
    scrollBottom();
  }
}

// ═══════════════════════════════════════════════════════════════
//  MESSAGE ELEMENTS
// ═══════════════════════════════════════════════════════════════
function makeMsgEl(role, content) {
  const wrap = document.createElement('div');
  if (role === 'user') {
    wrap.className = 'sf-user-msg';
    wrap.innerHTML = `
      <div class="group/message-row flex min-w-0 flex-col items-end gap-xs font-sans ms-auto max-w-[85%] cds-um-enter">
        <div class="relative flex max-w-full min-w-0 flex-col gap-xs rounded-card px-lg py-md text-heading break-words select-text text-primary bg-neutral">
          <div><div><div data-testid="user-message" class="grid grid-cols-1 gap-2 relative">
            <p class="whitespace-pre-wrap break-words">${esc(content)}</p>
          </div></div></div>
        </div>
      </div>`;
  } else {
    wrap.className = 'sf-asst-msg';
    wrap.innerHTML = buildAsstBubble(content);
  }
  return wrap;
}

function buildAsstBubble(content) {
  return `<div class="w-full font-sans prose prose-sm max-w-none sf-asst-content text-primary" style="font-size:15px;line-height:1.7;">${renderMd(content)}</div>`;
}

function makeTypingEl() {
  const wrap = document.createElement('div');
  wrap.className = 'sf-asst-msg';
  wrap.innerHTML = `<div class="sf-asst-content text-muted flex items-center gap-1 py-2" style="font-size:15px;"><div class="sf-typing"><span></span><span></span><span></span></div></div>`;
  return wrap;
}

// ═══════════════════════════════════════════════════════════════
//  MARKDOWN RENDERER
// ═══════════════════════════════════════════════════════════════
function renderMd(raw) {
  if (!raw) return '';
  let t = raw
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    // Fenced code blocks
    .replace(/```(\w*)\n?([\s\S]*?)```/g, (_,lang,code) =>
      `<pre class="rounded-lg bg-bg-300/50 border-0.5 border-border-300/20 p-4 overflow-x-auto my-3"><code class="text-xs font-mono text-primary">${code.trim()}</code></pre>`)
    // Inline code
    .replace(/`([^`\n]+)`/g, '<code class="text-xs font-mono bg-bg-300/50 border-0.5 border-border-300/20 rounded px-1 py-0.5 text-primary">$1</code>')
    // Headers
    .replace(/^### (.+)$/gm,'<h3 class="text-base font-semibold mt-4 mb-1 text-primary">$1</h3>')
    .replace(/^## (.+)$/gm,'<h2 class="text-lg font-semibold mt-5 mb-2 text-primary">$1</h2>')
    .replace(/^# (.+)$/gm,'<h1 class="text-xl font-bold mt-6 mb-2 text-primary">$1</h1>')
    // HR
    .replace(/^---+$/gm,'<hr class="border-border-300/20 my-4">')
    // Bold + italic
    .replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/__(.+?)__/g,'<strong>$1</strong>')
    .replace(/_(.+?)_/g,'<em>$1</em>')
    // Blockquote
    .replace(/^&gt; (.+)$/gm,'<blockquote class="border-l-2 border-border-300/40 pl-3 text-muted italic my-2">$1</blockquote>')
    // Links
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener" class="text-accent-secondary-100 underline decoration-1 underline-offset-2">$1</a>')
    // Lists
    .replace(/^[\*\-] (.+)$/gm,'<li class="ml-4 list-disc">$1</li>')
    .replace(/^\d+\. (.+)$/gm,'<li class="ml-4 list-decimal">$1</li>')
    // Newlines
    .replace(/\n/g,'<br>');
  // Wrap consecutive <li>
  t = t.replace(/(<li[^>]*>.*?<\/li>(<br>)?)+/g, m => `<ul class="my-2 space-y-1">${m.replace(/<br>/g,'')}</ul>`);
  return t;
}

// ═══════════════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════════════
function setBusy(v) {
  busy = v;
  document.getElementById('send-btn').style.display = v ? 'none' : '';
  document.getElementById('stop-btn').style.display = v ? 'flex' : 'none';
  if (!v) document.getElementById('send-btn').disabled = false;
}

function scrollBottom(instant) {
  const el = document.getElementById('messages-scroll');
  if (instant) el.scrollTop = el.scrollHeight;
  else requestAnimationFrame(() => el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' }));
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
